# Tools the C and C++ builds do not get from the system. No lock file is committed
# (.gitignore), so this resolves fresh on each of the platforms below.
[workspace]
name = "oopc"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = ">=3.9"
# rust/ and rust-inv/ build with bare rustc: no cargo project, no crates (REQ7/BLD-3).
rust = ">=1.77"

[pypi-dependencies]
libclang = "*"

# The oldest Python supported (REQ7/BLD-3): `pixi run -e py39 ...`.
[feature.py39.dependencies]
python = "3.9.*"

[environments]
py39 = ["py39"]
